[mod-name]
ai-engineer=AI Engineer

[mod-description]
ai-engineer=A second engineer that plays alongside you, powered by Claude through the AI Engineer helper app. It only listens to the player who paired it.

[command-help]
aie=Used by the AI Engineer helper app (RCON only).
ai=Talk to your AI engineer: /ai <message>. /ai alone opens the chat window, /ai stop stops it, /ai clear starts a new chat, /ai autopilot turns autopilot on or off.
ai-pair=Pair with the AI Engineer helper app: /ai-pair <code shown by the app>.
ai-cam=Follow your engineer with the camera (spectator mode, your character waits safely): /ai-cam [zoom]. Again to go back.
ai-timelapse=Save timelapse screenshots following your engineer, a wide shot of where you stand, or both: /ai-timelapse [follow|wide|both] [seconds] [wide zoom]. Again to stop.

[ai-engineer]
not-paired=You don't have an AI Engineer yet. Start the AI Engineer app and use /ai-pair <code>.

[mod-setting-name]
ai-engineer-teleport-when-stuck=Teleport the engineer when it's stuck

[mod-setting-description]
ai-engineer-teleport-when-stuck=If the engineer can't find a way to walk somewhere, it jumps there instead of giving up.
